<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Search</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         SEARCH AREA
         ========================= -->

    <div class="button">
      <input
        id="search-bar"
        type="text"
        placeholder="Search something!"
        autocomplete="off"
      />

      <div id="suggestions"></div>
    </div>

    <!-- =========================
         IMAGE
         ========================= -->

    <img src="" id="image" alt="" />

    <!-- =========================
         INFORMATION TABLE
         ========================= -->

    <div class="table" id="infoTable">
      <!-- NAME -->

      <div class="first-row">
        <div class="value-name" id="name"></div>
      </div>

      <!-- HOMETOWN -->

      <div class="row">
        <div class="label">Hometown:</div>

        <div class="value" id="hometown"></div>
      </div>

      <!-- COURSE -->

      <div class="row">
        <div class="label">Academics:</div>

        <div class="value" id="academics"></div>
      </div>

      <!-- CONTACT DETAILS -->

      <div class="row">
        <div class="label">Enrollment:</div>

        <div class="value" id="enrollment"></div>
      </div>

      <!-- MOBILE -->

      <div class="row">
        <div class="label">Mobile:</div>

        <div class="value" id="mobile"></div>
      </div>

      <!-- EMAIL -->

      <div class="row">
        <div class="label">Email:</div>

        <div class="value" id="email"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
